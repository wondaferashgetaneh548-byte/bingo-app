<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቢንጎ ጨዋታ ክፍለ-ጊዜ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 18px;
            color: #4ecca3;
            margin-bottom: 10px;
        }

        .timer-card {
            background: #16213e;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            border: 2px solid #0f3460;
        }

        .timer-text {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }

        .status-msg {
            font-size: 16px;
            color: #bbbbbb;
            margin-top: 5px;
        }

        .cartela-section {
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 10px;
        }

        .cartela-btn {
            background-color: #0f3460;
            color: #ffffff;
            border: 2px solid #e94560;
            padding: 20px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .cartela-btn:hover:not(:disabled) {
            background-color: #e94560;
            transform: translateY(-3px);
        }

        .cartela-btn:disabled {
            background-color: #333344;
            border-color: #555566;
            color: #888888;
            cursor: not-allowed;
            transform: none;
        }

        .cartela-btn.occupied {
            background-color: #d9534f;
            border-color: #d9534f;
            color: #ffffff;
        }

        .player-badge {
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">ተጫዋች፦ <strong>{{ request.user.username }}</strong></div>
        <div class="timer-card">
            <div id="timer-display" class="timer-text">--</div>
            <div id="status-display" class="status-msg">ከክፍሉ ጋር በመገናኘት ላይ...</div>
        </div>
    </div>

    <div class="cartela-section">
        <h3>ካርቴላ ይምረጡ (ከ1 - 20)</h3>
        <div class="cartela-grid" id="cartela-container">
            <!-- 20 ካርቴላዎች -->
            {% for i in "x"|rjust:"20" %}
                <button class="cartela-btn" id="cartela-{{ forloop.counter }}" onclick="holdCartela({{ forloop.counter }})">
                    <span>ካርቴላ #{{ forloop.counter }}</span>
                </button>
            {% endfor %}
        </div>
    </div>

    <script>
        // የክፍሉ ስም ከURL ወይም ከTemplate እንደ አስፈላጊነቱ መውሰድ ይቻላል
        const roomName = "room1"; 
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/${roomName}/`);

        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');

        socket.onopen = function() {
            statusDisplay.innerText = "ካርቴላ ይምረጡ!";
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            // 1. ለመጀመሪያ ጊዜ ሲገባ ክፍሉ ያለበትን ስቴት መውሰድ
            if (data.type === 'room_state') {
                if (data.status === 'PLAYING') {
                    lockGame("ጨዋታው ተጀምሯል! አዲስ ካርቴላ መያዝ አይቻልም።");
                }
                // ቀደሞ የተያዙ ካርቴላዎችን ማሳየት
                for (const [player, cartelaId] of Object.entries(data.players)) {
                    updateCartelaUI(cartelaId, player);
                }
            }

            // 2. የ 45 ሰከንድ ቆጠራ ማሳያ
            if (data.type === 'timer') {
                timerDisplay.innerText = `${data.time_left} ሰከንድ`;
                statusDisplay.innerText = "ካርቴላ መያዣ ጊዜው ሳያልቅ ይምረጡ";
            }

            // 3. በሌላ ተጫዋች ወይም በራስህ ካርቴላ ሲያዝ
            if (data.type === 'cartela_selected') {
                updateCartelaUI(data.cartela_id, data.player_name);
            }

            // 4. 45 ሰከንዱ ሲያልቅ ጨዋታውን መቆለፍ
            if (data.type === 'game_started') {
                lockGame("ጊዜው አልቋል! ጨዋታው ተጀምሯል።");
            }
        };

        socket.onclose = function() {
            statusDisplay.innerText = "ግንኙነቱ ተቋርጧል። እባክዎን ገጹን Refresh ያድርጉ።";
            disableAllCartelas();
        };

        // ካርቴላ መያዣ መልዕክት ወደ ሴርቨር መላክ
        function holdCartela(cartelaId) {
            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': cartelaId
            }));
        }

        // የተያዘን ካርቴላ UI ላይ Red ማድረግ
        function updateCartelaUI(cartelaId, playerName) {
            const btn = document.getElementById(`cartela-${cartelaId}`);
            if (btn) {
                btn.disabled = true;
                btn.classList.add('occupied');
                btn.innerHTML = `
                    <span>ካርቴላ #${cartelaId}</span>
                    <span class="player-badge">ተይዟል (${playerName})</span>
                `;
            }
        }

        // ጨዋታው ሲጀምር ሁሉንም ቁልፎች መቆለፍ
        function lockGame(message) {
            timerDisplay.innerText = "0 ሰከንድ";
            statusDisplay.innerText = message;
            disableAllCartelas();
        }

        function disableAllCartelas() {
            const buttons = document.querySelectorAll('.cartela-btn');
            buttons.forEach(btn => btn.disabled = true);
        }
    </script>
</body>
</html>
