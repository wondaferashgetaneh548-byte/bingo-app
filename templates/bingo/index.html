<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቢንጎ ጨዋታ ክፍለ-ጊዜ (400 ካርቴላ)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 18px;
            color: #4ecca3;
            margin-bottom: 10px;
        }

        .timer-card {
            background: #16213e;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            border: 2px solid #0f3460;
        }

        .timer-text {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }

        .status-msg {
            font-size: 16px;
            color: #bbbbbb;
            margin-top: 5px;
        }

        .cartela-section {
            margin-top: 20px;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* 400 ካርቴላዎች በስክሪኑ ላይ እንዳይረዝሙ Scrollable የተደረገ Box */
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 15px;
            padding: 15px;
            max-height: 520px;
            overflow-y: auto;
            background: #16213e;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        /* Scrollbar Styling */
        .cartela-grid::-webkit-scrollbar {
            width: 8px;
        }
        .cartela-grid::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }

        .cartela-btn {
            background-color: #0f3460;
            color: #ffffff;
            border: 1px solid #e94560;
            padding: 12px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .cartela-btn:hover:not(:disabled) {
            background-color: #e94560;
            transform: translateY(-2px);
        }

        .cartela-btn:disabled {
            background-color: #222233;
            border-color: #444455;
            color: #777788;
            cursor: not-allowed;
            transform: none;
        }

        .cartela-btn.occupied {
            background-color: #d9534f;
            border-color: #d9534f;
            color: #ffffff;
        }

        .player-badge {
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 3px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">ተጫዋች፦ <strong>{{ request.user.username }}</strong></div>
        <div class="timer-card">
            <div id="timer-display" class="timer-text">--</div>
            <div id="status-display" class="status-msg">ከክፍሉ ጋር በመገናኘት ላይ...</div>
        </div>
    </div>

    <div class="cartela-section">
        <h3>ካርቴላ ይምረጡ (ከ1 - 400)</h3>
        <!-- የDjango loop አስወግደን በባዶ ሳጥን ተክተነዋል -->
        <div class="cartela-grid" id="cartela-container"></div>
    </div>

    <script>
        // 1. ገጹ ሲከፈት 400 ካርቴላዎችን በJS በራሱ ያፈልቃል
        const container = document.getElementById('cartela-container');
        container.innerHTML = ''; 

        for (let i = 1; i <= 400; i++) {
            const btn = document.createElement('button');
            btn.className = 'cartela-btn';
            btn.id = `cartela-${i}`;
            btn.onclick = () => holdCartela(i);
            btn.innerHTML = `<span>ካርቴላ #${i}</span>`;
            container.appendChild(btn);
        }

        // 2. WebSocket ማዋቀሪያ
        const roomName = "room1"; 
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/${roomName}/`);

        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');

        socket.onopen = function() {
            statusDisplay.innerText = "ካርቴላ ይምረጡ!";
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === 'room_state') {
                if (data.status === 'PLAYING') {
                    lockGame("ጨዋታው ተጀምሯል! አዲስ ካርቴላ መያዝ አይቻልም።");
                }
                for (const [player, cartelaId] of Object.entries(data.players)) {
                    updateCartelaUI(cartelaId, player);
                }
            }

            if (data.type === 'timer') {
                timerDisplay.innerText = `${data.time_left} ሰከንድ`;
                statusDisplay.innerText = "ካርቴላ መያዣ ጊዜው ሳያልቅ ይምረጡ";
            }

            if (data.type === 'cartela_selected') {
                updateCartelaUI(data.cartela_id, data.player_name);
            }

            if (data.type === 'game_started') {
                lockGame("ጊዜው አልቋል! ጨዋታው ተጀምሯል።");
            }
        };

        socket.onclose = function() {
            statusDisplay.innerText = "ግንኙነቱ ተቋርጧል። ገጹን Refresh ያድርጉ።";
            disableAllCartelas();
        };

        function holdCartela(cartelaId) {
            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': cartelaId
            }));
        }

        function updateCartelaUI(cartelaId, playerName) {
            const btn = document.getElementById(`cartela-${cartelaId}`);
            if (btn) {
                btn.disabled = true;
                btn.classList.add('occupied');
                btn.innerHTML = `
                    <span>ካርቴላ #${cartelaId}</span>
                    <span class="player-badge">ተይዟል (${playerName})</span>
                `;
            }
        }

        function lockGame(message) {
            timerDisplay.innerText = "0 ሰከንድ";
            statusDisplay.innerText = message;
            disableAllCartelas();
        }

        function disableAllCartelas() {
            const buttons = document.querySelectorAll('.cartela-btn');
            buttons.forEach(btn => btn.disabled = true);
        }
    </script>
</body>
</html>
