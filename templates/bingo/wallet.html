<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አሁኑኑ BINGO - Rooms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #361042 0%, #170424 100%); color: white; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 1.5rem; font-weight: bold; color: #ffc107; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 0.95rem; }
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .btn-refresh { background: #ffc107; color: #111; border: none; padding: 6px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .wallet-badge { background: #ffc107; color: #111; padding: 6px 15px; border-radius: 6px; font-weight: bold; text-decoration: none; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .rooms-table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        .rooms-table th { padding: 12px 20px; text-align: center; color: #ddd; background: rgba(0, 0, 0, 0.4); }
        .room-row { background: rgba(255, 255, 255, 0.07); }
        .room-row td { padding: 16px 20px; text-align: center; font-weight: bold; }
        .stake-box { font-size: 1.1rem; }
        .status-playing { color: #e63946; }
        .status-none { color: #aaa; }
        .btn-join { display: inline-block; background: linear-gradient(180deg, #ffdb4d 0%, #ffb300 100%); color: #111; text-decoration: none; padding: 8px 22px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">⏰ አሁኑኑ BINGO</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="nav-right">
            <button class="btn-refresh" onclick="location.reload()">Refresh</button>
            <a href="#" class="wallet-badge">👛 ETB {{ user.wallet.balance|default:"500.00" }}</a>
        </div>
    </div>

    <div class="container">
        <table class="rooms-table">
            <thead>
                <tr>
                    <th>Stake</th>
                    <th>Active</th>
                    <th>Possible Win</th>
                    <th>Join</th>
                </tr>
            </thead>
            <tbody>
                <tr class="room-row">
                    <td><div class="stake-box">10birr</div></td>
                    <td class="status-playing">Playing</td>
                    <td>🎁 338 Birr</td>
                    <td><a href="{% url 'bingo:room_detail' stake=10 %}" class="btn-join">Join »</a></td>
                </tr>
                <tr class="room-row">
                    <td><div class="stake-box">20birr</div></td>
                    <td class="status-none">None</td>
                    <td>🎁 -</td>
                    <td><a href="{% url 'bingo:room_detail' stake=20 %}" class="btn-join">Join »</a></td>
                </tr>
                <tr class="room-row">
                    <td><div class="stake-box">30birr</div></td>
                    <td class="status-none">None</td>
                    <td>🎁 -</td>
                    <td><a href="{% url 'bingo:room_detail' stake=30 %}" class="btn-join">Join »</a></td>
                </tr>
                <tr class="room-row">
                    <td><div class="stake-box">50birr</div></td>
                    <td class="status-none">None</td>
                    <td>🎁 -</td>
                    <td><a href="{% url 'bingo:room_detail' stake=50 %}" class="btn-join">Join »</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
