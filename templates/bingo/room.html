<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቢንጎ ጨዋታ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .stake-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; max-width: 500px; margin: 20px auto; }
        .stake-btn { padding: 15px; background: #28a745; color: white; font-weight: bold; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 80%; max-width: 320px; border: 1px solid #333; }
        .btn-join { width: 100%; padding: 12px; background: #007bff; color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        #cartela-room-section { display: none; }
        .cartela-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 6px; max-height: 250px; overflow-y: auto; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 15px; }
        .cartela-btn { padding: 10px 0; background: #2a2a2a; color: #fff; font-weight: bold; border: 1px solid #444; border-radius: 5px; cursor: pointer; }
        .cartela-btn.selected { background: #ffc107; color: #000; border-color: #ffc107; }
        .cartela-btn.taken { background: #dc3545; color: #fff; cursor: not-allowed; }
        .game-status-card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        #timer-display { color: #ffc107; font-size: 20px; margin: 5px 0; }
        #last-drawn-number { font-size: 24px; color: #2ecc71; font-weight: bold; margin: 5px 0; }
        .btn-bingo-claim { background: #dc3545; color: #fff; font-size: 22px; font-weight: bold; padding: 12px 35px; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; display: none; }
        .card-container { background: rgba(45, 20, 70, 0.95); border-radius: 20px; padding: 20px; width: 320px; margin: 0 auto; text-align: center; color: white; border: 2px solid #f1c40f; }
        .bingo-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .b-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; }
        .b-purple { background: #4a2574; } .b-yellow { background: #d4ac0d; } .b-red { background: #e74c3c; } .b-green { background: #2ecc71; } .b-red2 { background: #ff0000; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .bingo-box { background: #ffffff; color: #000000; font-weight: bold; font-size: 18px; border-radius: 6px; height: 42px; display: flex; align-items: center; justify-content: center; }
        .bingo-box.free-space { background: #007bff; color: #ffffff; font-size: 20px; font-weight: 900; }
        .bingo-box.matched { background: #ffc107 !important; color: #000 !important; }
        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn-modal-back { background: #6c757d; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-modal-confirm { background: #28a745; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        #my-live-cartela-section { display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="stake-section">
        <h2>የመጫወቻ ብር ይምረጡ</h2>
        <div class="stake-grid">
            <button class="stake-btn" onclick="openJoinModal(10)">10 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(20)">20 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(30)">30 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(50)">50 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(100)">100 ETB</button>
        </div>
    </div>

    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">ክፍል</h3>
            <p>ወደ ጨዋታው መግባት ይፈልጋሉ?</p>
            <button class="btn-join" onclick="joinRoom()">JOIN</button>
            <button style="margin-top:10px; background:none; border:none; color:#aaa; cursor:pointer;" onclick="closeModal('joinModal')">ሰርዝ</button>
        </div>
    </div>

    <div id="cartela-room-section">
        <h3 id="room-title">ካርቴላ ይምረጡ</h3>
        <button onclick="goBackToStakes()" style="margin-bottom: 10px; padding: 6px 15px; background: #6c757d; color: #fff; border: none; border-radius: 4px; cursor: pointer;">← ክፍሎችን ቀይር</button>
        <div class="game-status-card">
            <div id="timer-display">ካርቴላ ይምረጡ...</div>
            <div id="last-drawn-number"></div>
        </div>
        <div id="cartela-grid" class="cartela-grid"></div>
        <div id="my-live-cartela-section">
            <h3>የእርስዎ ካርቴላ (<span id="my-card-num-title">-</span>)</h3>
            <div class="card-container">
                <div class="bingo-header">
                    <span class="b-circle b-purple">B</span>
                    <span class="b-circle b-yellow">I</span>
                    <span class="b-circle b-red">N</span>
                    <span class="b-circle b-green">G</span>
                    <span class="b-circle b-red2">O</span>
                </div>
                <div id="live-bingo-grid" class="bingo-grid"></div>
            </div>
            <button id="claim-bingo-btn" class="btn-bingo-claim" onclick="claimBingo()">BINGO!</button>
        </div>
    </div>

    <div id="cardPreviewModal" class="modal">
        <div class="card-container">
            <h2 class="card-title">Card No. <span id="preview-card-num">10</span></h2>
            <div class="bingo-header">
                <span class="b-circle b-purple">B</span>
                <span class="b-circle b-yellow">I</span>
                <span class="b-circle b-red">N</span>
                <span class="b-circle b-green">G</span>
                <span class="b-circle b-red2">O</span>
            </div>
            <div id="modal-bingo-grid" class="bingo-grid"></div>
            <div class="modal-buttons">
                <button type="button" class="btn-modal-back" onclick="closeModal('cardPreviewModal')">ተመለስ</button>
                <button type="button" class="btn-modal-confirm" onclick="confirmCartela()">ምረጥ (Confirm)</button>
            </div>
        </div>
    </div>

    <script>
        let selectedStake = null;
        let selectedCartelaId = null;
        let socket = null;
        let drawnNumbersSet = new Set();

        function openJoinModal(stake) {
            selectedStake = stake;
            document.getElementById('modal-title').innerText = `የ ${stake} ETB ክፍል`;
            document.getElementById('joinModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function joinRoom() {
            closeModal('joinModal');
            document.getElementById('stake-section').style.display = 'none';
            document.getElementById('cartela-room-section').style.display = 'block';
            document.getElementById('room-title').innerText = `የ ${selectedStake} ETB ክፍል`;
            render400Cartelas();
            connectWebSocket(selectedStake);
        }

        function render400Cartelas() {
            const grid = document.getElementById('cartela-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 400; i++) {
                const btn = document.createElement('button');
                btn.className = 'cartela-btn';
                btn.id = `cartela-${i}`;
                btn.innerText = i;
                btn.onclick = () => openCardPreviewModal(i);
                grid.appendChild(btn);
            }
        }

        function generateBingoNumbers(cardId) {
            let seed = cardId * 997;
            function randomRange(min, max) {
                seed = (seed * 9301 + 49297) % 233280;
                return Math.floor(min + (seed / 233280) * (max - min + 1));
            }
            let cols = { B: [], I: [], N: [], G: [], O: [] };
            let ranges = [
                { key: 'B', min: 1, max: 15, count: 5 },
                { key: 'I', min: 16, max: 30, count: 5 },
                { key: 'N', min: 31, max: 45, count: 4 },
                { key: 'G', min: 46, max: 60, count: 5 },
                { key: 'O', min: 61, max: 75, count: 5 }
            ];
            ranges.forEach(r => {
                while (cols[r.key].length < r.count) {
                    let num = randomRange(r.min, r.max);
                    if (!cols[r.key].includes(num)) cols[r.key].push(num);
                }
            });
            let flatArray = [];
            for (let row = 0; row < 5; row++) {
                flatArray.push(cols.B[row]);
                flatArray.push(cols.I[row]);
                if (row === 2) flatArray.push('F');
                else {
                    let nIdx = row > 2 ? row - 1 : row;
                    flatArray.push(cols.N[nIdx]);
                }
                flatArray.push(cols.G[row]);
                flatArray.push(cols.O[row]);
            }
            return flatArray;
        }

        function openCardPreviewModal(id) {
            selectedCartelaId = id;
            document.getElementById('preview-card-num').innerText = id;
            let grid = document.getElementById('modal-bingo-grid');
            grid.innerHTML = '';
            generateBingoNumbers(id).forEach(val => {
                let cell = document.createElement('div');
                cell.className = 'bingo-box';
                if (val === 'F') { cell.innerText = 'F'; cell.classList.add('free-space'); }
                else { cell.innerText = val; }
                grid.appendChild(cell);
            });
            document.getElementById('cardPreviewModal').style.display = 'flex';
        }

        function confirmCartela() {
            if (!selectedCartelaId) return;
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ 'action': 'select_cartela', 'cartela_id': selectedCartelaId }));
            }
            closeModal('cardPreviewModal');
            renderLiveCartela(selectedCartelaId);
            document.querySelectorAll('.cartela-btn.selected').forEach(el => el.classList.remove('selected'));
            document.getElementById(`cartela-${selectedCartelaId}`).classList.add('selected');
        }

        function renderLiveCartela(id) {
            document.getElementById('my-card-num-title').innerText = id;
            let grid = document.getElementById('live-bingo-grid');
            grid.innerHTML = '';
            generateBingoNumbers(id).forEach(val => {
                let cell = document.createElement('div');
                cell.className = 'bingo-box';
                cell.dataset.number = val;
                if (val === 'F') { cell.innerText = 'F'; cell.classList.add('free-space'); }
                else {
                    cell.innerText = val;
                    if (drawnNumbersSet.has(val)) cell.classList.add('matched');
                }
                grid.appendChild(cell);
            });
            document.getElementById('my-live-cartela-section').style.display = 'block';
        }

        function goBackToStakes() {
            if (socket) socket.close();
            selectedCartelaId = null;
            drawnNumbersSet.clear();
            document.getElementById('cartela-room-section').style.display = 'none';
            document.getElementById('stake-section').style.display = 'block';
        }

        function connectWebSocket(stake) {
            const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
            socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/room_${stake}/`);
            socket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                if (data.type === 'cartela_selected') {
                    const btn = document.getElementById(`cartela-${data.cartela_id}`);
                    if (btn) { btn.classList.add('taken'); btn.disabled = true; }
                } else if (data.type === 'timer_update') {
                    document.getElementById('timer-display').innerText = `ጨዋታው ለመጀመር: ${data.seconds} ሰከንድ`;
                } else if (data.type === 'game_started') {
                    document.getElementById('timer-display').innerText = "ጨዋታው ተጀምሯል!";
                    document.getElementById('claim-bingo-btn').style.display = 'inline-block';
                    document.getElementById('cartela-grid').style.display = 'none';
                } else if (data.type === 'number_drawn') {
                    let num = data.number;
                    drawnNumbersSet.add(num);
                    document.getElementById('last-drawn-number').innerText = `ወጣቱ ቁጥር: ${num}`;
                    document.querySelectorAll('#live-bingo-grid .bingo-box').forEach(box => {
                        if (box.dataset.number == num) box.classList.add('matched');
                    });
                } else if (data.type === 'game_over') {
                    alert(`አሸናፊ: ${data.winner} (ካርቴላ ቁጥር ${data.cartela_id})! አዲስ ጨዋታ ይጀምራል።`);
                    location.reload();
                }
            };
        }

        function claimBingo() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ 'action': 'claim_bingo' }));
            }
        }
    </script>
</body>
</html>
