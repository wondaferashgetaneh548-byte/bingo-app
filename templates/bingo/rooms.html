<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቢንጎ ጨዋታ ክፍለ-ጊዜ (400 ካርቴላ)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .user-info {
            font-size: 18px;
            color: #4ecca3;
            margin-bottom: 10px;
        }

        .timer-card {
            background: #16213e;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            border: 2px solid #0f3460;
        }

        .timer-text {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }

        /* አዲስ የተጨመረ የወጡ ቁጥሮች ማሳያ Box */
        .game-play-area {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e94560;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .current-number {
            font-size: 60px;
            font-weight: bold;
            color: #4ecca3;
            background: #0f3460;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #4ecca3;
            margin: 10px 0;
        }

        .drawn-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
            justify-content: center;
        }

        .drawn-ball {
            background: #e94560;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .cartela-section {
            margin-top: 20px;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 15px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            background: #16213e;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        .cartela-btn {
            background-color: #0f3460;
            color: #ffffff;
            border: 1px solid #e94560;
            padding: 12px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .cartela-btn:disabled {
            background-color: #222233;
            border-color: #444455;
            color: #777788;
            cursor: not-allowed;
        }

        .cartela-btn.occupied {
            background-color: #d9534f;
            border-color: #d9534f;
            color: #ffffff;
        }

        .cartela-btn.my-cartela {
            background-color: #28a745;
            border-color: #28a745;
            color: #ffffff;
        }

        .player-badge {
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">ተጫዋች፦ <strong id="current-user">{% if request.user.is_authenticated %}{{ request.user.username }}{% else %}Guest{% endif %}</strong></div>
        <div class="timer-card">
            <div id="timer-display" class="timer-text">--</div>
            <div id="status-display" class="status-msg">ከክፍሉ ጋር በመገናኘት ላይ...</div>
        </div>
    </div>

    <!-- ጨዋታው ሲጀምር የሚወጡ ቁጥሮች ማሳያ -->
    <div id="game-play-area" class="game-play-area">
        <h3>የወጣ ቁጥር</h3>
        <div id="current-number" class="current-number">--</div>
        <h4>የወጡ ቁጥሮች ዝርዝር፦</h4>
        <div id="drawn-list" class="drawn-list"></div>
    </div>

    <div class="cartela-section">
        <h3 id="cartela-title">ካርቴላ ይምረጡ (ከ1 - 400)</h3>
        <div class="cartela-grid" id="cartela-container"></div>
    </div>

    <script>
        let currentUser = document.getElementById('current-user').innerText.trim();
        const container = document.getElementById('cartela-container');
        container.innerHTML = ''; 

        for (let i = 1; i <= 400; i++) {
            const btn = document.createElement('button');
            btn.className = 'cartela-btn';
            btn.id = `cartela-${i}`;
            btn.onclick = () => holdCartela(i);
            btn.innerHTML = `<span>ካርቴላ #${i}</span>`;
            container.appendChild(btn);
        }

        const roomName = "room1"; 
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/${roomName}/`);

        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');
        const gamePlayArea = document.getElementById('game-play-area');
        const currentNumberDisplay = document.getElementById('current-number');
        const drawnListDisplay = document.getElementById('drawn-list');

        socket.onopen = function() {
            statusDisplay.innerText = "ካርቴላ ይምረጡ!";
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === 'room_state') {
                if (data.status === 'PLAYING') {
                    lockGame("ጨዋታው ተጀምሯል!");
                }
                for (const [player, cartelaId] of Object.entries(data.players)) {
                    updateCartelaUI(cartelaId, player);
                }
            }

            if (data.type === 'timer') {
                timerDisplay.innerText = `${data.time_left} ሰከንድ`;
                statusDisplay.innerText = "ካርቴላ መያዣ ጊዜው ሳያልቅ ይምረጡ";
            }

            if (data.type === 'cartela_selected') {
                updateCartelaUI(parseInt(data.cartela_id), data.player_name);
            }

            if (data.type === 'game_started') {
                lockGame("ጊዜው አልቋል! ጨዋታው ተጀምሯል።");
            }

            if (data.type === 'new_number') {
                currentNumberDisplay.innerText = data.number;
                renderDrawnNumbers(data.all_drawn);
            }
        };

        socket.onclose = function() {
            statusDisplay.innerText = "ግንኙነቱ ተቋርጧል። ገጹን Refresh ያድርጉ።";
            disableAllCartelas();
        };

        function holdCartela(cartelaId) {
            if (socket.readyState !== WebSocket.OPEN) {
                alert("ከሰርቨሩ ጋር አልተገናኘህም። ገጹን Refresh አድርግ!");
                return;
            }
            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': cartelaId
            }));
        }

        function updateCartelaUI(cartelaId, playerName) {
            const existingBadges = document.querySelectorAll('.player-badge');
            existingBadges.forEach(badge => {
                if (badge.innerText.includes(`(${playerName})`)) {
                    const oldBtn = badge.parentElement;
                    const oldId = oldBtn.id.replace('cartela-', '');
                    oldBtn.disabled = false;
                    oldBtn.className = 'cartela-btn';
                    oldBtn.innerHTML = `<span>ካርቴላ #${oldId}</span>`;
                }
            });

            const btn = document.getElementById(`cartela-${cartelaId}`);
            if (btn) {
                btn.disabled = true;
                if (playerName === currentUser) {
                    btn.className = 'cartela-btn my-cartela';
                } else {
                    btn.className = 'cartela-btn occupied';
                }
                btn.innerHTML = `
                    <span>ካርቴላ #${cartelaId}</span>
                    <span class="player-badge">ተይዟል (${playerName})</span>
                `;
            }
        }

        function lockGame(message) {
            timerDisplay.innerText = "0 ሰከንድ";
            statusDisplay.innerText = message;
            gamePlayArea.style.display = 'flex'; // የቁጥር ማሳያ ሳጥኑን ማሳየት
            disableAllCartelas();
        }

        function disableAllCartelas() {
            const buttons = document.querySelectorAll('.cartela-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        function renderDrawnNumbers(drawnArray) {
            drawnListDisplay.innerHTML = '';
            drawnArray.forEach(num => {
                const ball = document.createElement('span');
                ball.className = 'drawn-ball';
                ball.innerText = num;
                drawnListDisplay.appendChild(ball);
            });
        }
    </script>
</body>
</html>
