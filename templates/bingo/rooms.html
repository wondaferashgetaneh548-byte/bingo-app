<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቢንጎ ጨዋታ - ክፍለ {{ stake }} ETB</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-panel {
            background: #16213e;
            width: 100%;
            max-width: 900px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
            text-align: center;
        }

        .pot-box span {
            font-size: 1.2em;
            font-weight: bold;
            color: #e94560;
        }

        .timer-box span {
            font-size: 1.4em;
            font-weight: bold;
            color: #4ecca3;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* 1. የካርቴላ መምረጫ Grid */
        .selection-section {
            width: 100%;
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .cartela-btn {
            padding: 12px;
            background: #0f3460;
            border: 1px solid #4ecca3;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .cartela-btn.taken {
            background: #e94560;
            cursor: not-allowed;
            border-color: #e94560;
        }

        .cartela-btn.selected {
            background: #28a745;
            border-color: #fff;
        }

        /* 2. ጨዋታው ሲጀምር የሚታዩ ክፍሎች */
        .game-play-area {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e94560;
            flex: 1;
            min-width: 280px;
        }

        .current-number {
            font-size: 3em;
            color: #ff2e63;
            font-weight: bold;
            margin: 10px 0;
        }

        .drawn-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            justify-content: center;
        }

        .drawn-ball {
            background: #0f3460;
            padding: 6px 10px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* 3. የነጻ/የኔ ካርቴላ ማሳያ */
        .my-cartela-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #28a745;
            flex: 1;
            min-width: 280px;
        }

        .bingo-table {
            border-collapse: collapse;
            margin-top: 10px;
        }

        .bingo-table th, .bingo-table td {
            border: 2px solid #0f3460;
            width: 45px;
            height: 45px;
            text-align: center;
            font-weight: bold;
        }

        .bingo-table th {
            background-color: #e94560;
            color: white;
        }

        .bingo-table td {
            background-color: #1a1a2e;
        }

        .bingo-table td.matched {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="pot-box">
            <div>ጠቅላላ ፖት (Total): <span id="total-pot-amount">0</span> ETB</div>
            <div>ለአሸናፊው (Winner): <span id="winner-pot-amount">0</span> ETB</div>
        </div>
        <div class="timer-box">
            <div>ጊዜ: <span id="timer-display">--</span></div>
            <div id="status-display" style="color: #aaa; font-size: 0.9em;">ካርቴላ ይምረጡ</div>
        </div>
    </div>

    <!-- 1. የካርቴላ መምረጫ -->
    <div id="selection-section" class="selection-section">
        <h3>ካርቴላ ይምረጡ (1 - 100)</h3>
        <div id="cartela-grid" class="cartela-grid"></div>
    </div>

    <div class="main-layout">
        <!-- 2. የወጣ ቁጥር ማሳያ -->
        <div id="game-play-area" class="game-play-area">
            <h3>የወጣ ቁጥር</h3>
            <div id="current-number" class="current-number">--</div>
            <h4>የወጡ ቁጥሮች፦</h4>
            <div id="drawn-list" class="drawn-list"></div>
        </div>

        <!-- 3. የኔ ካርቴላ (5x5 Table) -->
        <div id="my-cartela-container" class="my-cartela-container">
            <h3 id="my-cartela-title" style="color: #4ecca3;">የእርስዎ ካርቴላ</h3>
            <table class="bingo-table">
                <thead>
                    <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
                </thead>
                <tbody id="cartela-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const roomName = "{{ room_name }}";
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/${roomName}/`);

        const cartelaGrid = document.getElementById('cartela-grid');
        const selectionSection = document.getElementById('selection-section');
        const gamePlayArea = document.getElementById('game-play-area');
        const myCartelaContainer = document.getElementById('my-cartela-container');
        const cartelaBody = document.getElementById('cartela-body');
        const drawnListDisplay = document.getElementById('drawn-list');
        const currentNumberDisplay = document.getElementById('current-number');
        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');

        let mySelectedCartelaId = null;

        // 100 የካርቴላ ቁልፎችን መፍጠር
        function buildSelectionGrid() {
            cartelaGrid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const btn = document.createElement('button');
                btn.className = 'cartela-btn';
                btn.id = `cartela-btn-${i}`;
                btn.innerText = i;
                btn.onclick = () => selectCartela(i);
                cartelaGrid.appendChild(btn);
            }
        }
        buildSelectionGrid();

        function selectCartela(id) {
            if (mySelectedCartelaId) return; // አንድ ጊዜ ብቻ መምረጥ እንዲችል
            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': id
            }));
        }

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === 'room_state') {
                updatePotUI(data.total_pot, data.winner_pot, data.commission);
                for (const [player, cId] of Object.entries(data.players)) {
                    markCartelaTaken(cId, player);
                }
                if (data.status === 'PLAYING') {
                    lockGame("ጨዋታው ተጀምሯል!");
                }
            }

            if (data.type === 'my_cartela_data') {
                mySelectedCartelaId = data.cartela_id;
                renderMyCartela(data.cartela_id, data.matrix);
            }

            if (data.type === 'cartela_selected') {
                markCartelaTaken(data.cartela_id, data.player_name);
                updatePotUI(data.total_pot, data.winner_pot, data.commission);
            }

            if (data.type === 'timer_update') {
                timerDisplay.innerText = `${data.seconds} ሰከንድ`;
                statusDisplay.innerText = "ጨዋታው ሊጀምር ነው...";
            }

            if (data.type === 'game_started') {
                lockGame("ጨዋታው ተጀምሯል!");
            }

            if (data.type === 'number_drawn') {
                displayDrawnNumber(data.number);
            }
        };

        function updatePotUI(total, winner, commission) {
            document.getElementById('total-pot-amount').innerText = total || 0;
            document.getElementById('winner-pot-amount').innerText = winner || 0;
        }

        function markCartelaTaken(cartelaId, player) {
            const btn = document.getElementById(`cartela-btn-${cartelaId}`);
            if (btn) {
                btn.classList.add('taken');
                btn.disabled = true;
            }
        }

        function renderMyCartela(cartelaId, matrix) {
            document.getElementById('my-cartela-title').innerText = `የእርስዎ ካርቴላ #${cartelaId}`;
            cartelaBody.innerHTML = '';

            matrix.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(val => {
                    const td = document.createElement('td');
                    td.innerText = val;
                    if (val === 'FREE') {
                        td.classList.add('matched');
                    } else {
                        td.setAttribute('data-num', val);
                    }
                    tr.appendChild(td);
                });
                cartelaBody.appendChild(tr);
            });

            // መምረጫው ላይ አረንጓዴ ማድረግ
            const btn = document.getElementById(`cartela-btn-${cartelaId}`);
            if (btn) btn.classList.add('selected');

            // የኔን ካርቴላ ማሳየት
            myCartelaContainer.style.display = 'flex';
        }

        function lockGame(msg) {
            selectionSection.style.display = 'none';
            gamePlayArea.style.display = 'flex';
            myCartelaContainer.style.display = 'flex'; // <<-- ካርቴላው እንዲታይ ያደርጋል
            statusDisplay.innerText = msg;
        }

        function displayDrawnNumber(num) {
            currentNumberDisplay.innerText = num;
            
            const ball = document.createElement('div');
            ball.className = 'drawn-ball';
            ball.innerText = num;
            drawnListDisplay.appendChild(ball);

            // ካርቴላ ላይ ያለው ቁጥር ከወጣ ማድመቅ
            const matchedTd = cartelaBody.querySelector(`td[data-num="${num}"]`);
            if (matchedTd) {
                matchedTd.classList.add('matched');
            }
        }
    </script>
</body>
</html>
