<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቢንጎ ጨዋታ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        
        /* 1. የብር መምረጫ Buttons */
        .stake-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; max-width: 500px; margin: 20px auto; }
        .stake-btn { padding: 15px; background: #28a745; color: white; font-weight: bold; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; }
        
        /* 2. Join Pop-up Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 80%; max-width: 320px; border: 1px solid #333; }
        .btn-join { width: 100%; padding: 12px; background: #007bff; color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }

        /* 3. የ 400 ካርቴላዎች Grid */
        #cartela-room-section { display: none; }
        .cartela-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 6px; max-height: 350px; overflow-y: auto; padding: 10px; background: #1e1e1e; border-radius: 8px; }
        .cartela-btn { padding: 10px 0; background: #2a2a2a; color: #fff; font-weight: bold; border: 1px solid #444; border-radius: 5px; cursor: pointer; }
        .cartela-btn.selected { background: #ffc107; color: #000; border-color: #ffc107; }
        .cartela-btn.taken { background: #dc3545; color: #fff; cursor: not-allowed; }

        /* 4. Action Buttons (Back & Confirm) */
        .action-bar { display: none; justify-content: space-between; margin-top: 15px; gap: 10px; }
        .btn-back { flex: 1; padding: 12px; background: #6c757d; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: #28a745; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ደረጃ 1፦ የብር መምረጫ -->
    <div id="stake-section">
        <h2>የመጫወቻ ብር ይምረጡ</h2>
        <div class="stake-grid">
            <button class="stake-btn" onclick="openJoinModal(10)">10 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(20)">20 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(30)">30 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(50)">50 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(100)">100 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(200)">200 ETB</button>
            <button class="stake-btn" onclick="openJoinModal(300)">300 ETB</button>
        </div>
    </div>

    <!-- ደረጃ 2፦ Join Modal Pop-up -->
    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">የ 10 ETB ክፍል</h3>
            <p>ወደ ጨዋታው መግባት ይፈልጋሉ?</p>
            <button class="btn-join" onclick="joinRoom()">JOIN</button>
            <button style="margin-top:10px; background:none; border:none; color:#aaa; cursor:pointer;" onclick="closeModal()">ሰርዝ</button>
        </div>
    </div>

    <!-- ደረጃ 3፦ የ 400 ካርቴላዎች ክፍል -->
    <div id="cartela-room-section">
        <h3 id="room-title">ካርቴላ ይምረጡ</h3>
        <div id="cartela-grid" class="cartela-grid"></div>

        <!-- ደረጃ 4፦ Back እና Confirm ቁልፎች -->
        <div id="action-bar" class="action-bar">
            <button class="btn-back" onclick="goBackToStakes()">BACK</button>
            <button class="btn-confirm" onclick="confirmCartela()">CONFIRM</button>
        </div>
    </div>

    <script>
        let selectedStake = null;
        let selectedCartelaId = null;
        let socket = null;

        // 1. የብር መጠን ሲነካ Modal መክፈት
        function openJoinModal(stake) {
            selectedStake = stake;
            document.getElementById('modal-title').innerText = `የ ${stake} ETB ክፍል`;
            document.getElementById('joinModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('joinModal').style.display = 'none';
        }

        // 2. JOIN ሲነካ ወደ ካርቴላ ክፍል መግባት
        function joinRoom() {
            closeModal();
            document.getElementById('stake-section').style.display = 'none';
            document.getElementById('cartela-room-section').style.display = 'block';
            document.getElementById('room-title').innerText = `የ ${selectedStake} ETB ክፍል - ካርቴላ ይምረጡ`;

            // 400 ካርቴላዎችን ማሳየት
            render400Cartelas();

            // WebSocket ማገናኘት
            connectWebSocket(selectedStake);
        }

        // 3. 400 ካርቴላዎችን መፍጠር (1 - 400)
        function render400Cartelas() {
            const grid = document.getElementById('cartela-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 400; i++) {
                const btn = document.createElement('button');
                btn.className = 'cartela-btn';
                btn.id = `cartela-${i}`;
                btn.innerText = i;
                btn.onclick = () => selectCartelaTemp(i);
                grid.appendChild(btn);
            }
        }

        // 4. ካርቴላ በጊዜያዊነት ሲመረጥ Back & Confirm ማሳየት
        function selectCartelaTemp(id) {
            // ቀድመው የተመረጡትን ቢጫነት ማንሳት
            document.querySelectorAll('.cartela-btn.selected').forEach(el => el.classList.remove('selected'));

            selectedCartelaId = id;
            document.getElementById(`cartela-${id}`).classList.add('selected');

            // Back እና Confirm ቁልፎችን ማሳየት
            document.getElementById('action-bar').style.display = 'flex';
        }

        // 5. BACK ቁልፍ፦ ምርጫውን ሰርዞ ወደ ብር መምረጫ መመለስ
        function goBackToStakes() {
            if (socket) socket.close();
            selectedCartelaId = null;
            document.getElementById('action-bar').style.display = 'none';
            document.getElementById('cartela-room-section').style.display = 'none';
            document.getElementById('stake-section').style.display = 'block';
        }

        // 6. CONFIRM ቁልፍ፦ ምርጫውን አፅድቆ ወደ Server መላክ
        function confirmCartela() {
            if (!selectedCartelaId) return;

            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': selectedCartelaId
            }));

            alert(`ካርቴላ ቁጥር ${selectedCartelaId} በትክክል ተረጋግጧል!`);
            document.getElementById('action-bar').style.display = 'none';
        }

        // WebSocket ማገናኛ
        function connectWebSocket(stake) {
            const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
            socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/room_${stake}/`);

            socket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                
                // ሌሎች ተጫዋቾች የያዟቸውን ካርቴላዎች ቀይ ማድረግ
                if (data.type === 'cartela_selected') {
                    const btn = document.getElementById(`cartela-${data.cartela_id}`);
                    if (btn) {
                        btn.classList.add('taken');
                        btn.disabled = true;
                    }
                }
            };
        }
    </script>
</body>
</html>
