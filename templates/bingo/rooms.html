<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Bingo Game Room</title>
    <style>
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 500px;
            margin-top: 20px;
        }
        .cartela-btn {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .cartela-btn:disabled {
            background-color: #d32f2f;
            cursor: not-allowed;
        }
        #timer-display {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
        }
    </style>
</head>
<body>

    <h2>እንኳን ደህና መጡ, {{ request.user.username }}!</h2>
    <div id="timer-display">የ 45 ሰከንድ ቆጠራ በመጠበቅ ላይ...</div>

    <h3>ካርቴላ ይምረጡ፡</h3>
    <div class="cartela-grid" id="cartela-container">
        <!-- ለምሳሌ 400 ካርቴላዎች -->
        {% for i in "x"|rjust:"400" %}
            <button class="cartela-btn" id="cartela-{{ forloop.counter }}" onclick="selectCartela({{ forloop.counter }})">
                ካርቴላ #{{ forloop.counter }}
            </button>
        {% endfor %}
    </div>

    <script>
        const roomName = "room1"; // የክፍሉ ስም
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/bingo/${roomName}/`);

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            // 1. የመጀመሪያ የክፍሉ ስቴት መረጃ
            if (data.type === 'room_state') {
                if (data.status === 'PLAYING') {
                    document.getElementById('timer-display').innerText = "ጨዋታው ተጀምሯል! አዲስ ካርቴላ መያዝ አይቻልም።";
                    disableAllCartelas();
                }
                // ቀደም ሲል የተያዙ ካርቴላዎችን ማሳየት
                for (const [player, cartelaId] of Object.entries(data.players)) {
                    markCartelaAsTaken(cartelaId, player);
                }
            }

            // 2. የቆጠራ ሰከንድ ማሳያ
            if (data.type === 'timer') {
                document.getElementById('timer-display').innerText = `ጨዋታው ለመጀመር: ${data.time_left} ሰከንድ ቀረ`;
            }

            // 3. በሌላ ተጫዋች ወይም በራስህ ካርቴላ ሲያዝ
            if (data.type === 'cartela_selected') {
                markCartelaAsTaken(data.cartela_id, data.player_name);
            }

            // 4. 45 ሰከንዱ ሲያልቅ
            if (data.type === 'game_started') {
                document.getElementById('timer-display').innerText = "ጊዜው አብቅቷል! ጨዋታው ተጀምሯል።";
                disableAllCartelas();
            }
        };

        // ካርቴላ ለመያዝ ወደ Backend መላክ
        function selectCartela(cartelaId) {
            socket.send(JSON.stringify({
                'action': 'select_cartela',
                'cartela_id': cartelaId
            }));
        }

        // የተያዘን ካርቴላ UI ላይ Red ማድረግ
        function markCartelaAsTaken(cartelaId, playerName) {
            const btn = document.getElementById(`cartela-${cartelaId}`);
            if (btn) {
                btn.disabled = true;
                btn.innerText = `ተይዟል (${playerName})`;
            }
        }

        // ሁሉንም ካርቴላዎች መቆለፍ
        function disableAllCartelas() {
            const buttons = document.querySelectorAll('.cartela-btn');
            buttons.forEach(btn => btn.disabled = true);
        }
    </script>
</body>
</html>
